version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - unconvert
  settings:
    errcheck:
      # Writing CLI output to the terminal: there is nothing useful to do if it fails.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      # Generated by sqlc.
      - path: internal/store/
        linters: [gosec]
      # Tests build fake request cookies and fixtures on purpose.
      - path: _test\.go
        linters: [gosec]
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - greyship.tech
