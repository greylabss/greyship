# Garage (S3-compatible storage) for local development: one node, data in a Docker volume.
# These secrets are for the dev container only; production gets its own (decisions.md 029).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "6772657973686970206465762072706320736563726574206e6f742070726f64"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.localhost"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "greyship-dev-admin-token"
