# Postgres and Garage on the Greyship server, reachable only on the server's loopback. Started by
# greyship-infra.service; secrets come from /etc/greyship/infra.env (written by bootstrap.sh).
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: greyship
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: greyship
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - greyship-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greyship"]
      interval: 2s
      timeout: 2s
      retries: 30

  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:3900:3900"
    volumes:
      - /etc/greyship/garage.toml:/etc/garage.toml:ro,Z
      - greyship-garage:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  greyship-pg:
  greyship-garage:
